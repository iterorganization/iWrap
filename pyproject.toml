[build-system]
requires = ["setuptools>=61", "wheel", "setuptools_scm[toml]>=7.0"]
build-backend = "setuptools.build_meta"


[project]
name = "iwrap"
description = "A modular component generator, implemented in Python, used for creating IMAS actors from physics models."
authors = [{name = "iWrap Developers", email = "olivier.hoenen@iter.org"}]
license = {text = "ITER license"}
readme = "README.md"
requires-python = ">=3.8"
dynamic = ["version"]
dependencies = [
    "lxml",
    "jinja2",
    "packaging",
    "pyyaml",
    "f90nml",
    "jsonschema",
    "JPype1",
]

[project.optional-dependencies]
muscle3 = ["muscle3>=0.7.0"]
all = ["muscle3>=0.7.0"]

[project.scripts]
iwrap = "bin.run:cmd_line"
iwrap-gui = "bin.run:gui"

[project.urls]
Homepage = "https://github.com/iterorganization/iWrap.git"


[tool.setuptools_scm]
version_file = "iwrap/_version.py"
local_scheme = "no-local-version"

[tool.setuptools]
include-package-data = true
script-files = ["bin/iwrap-doc", "bin/iwrap-yaml-update"]

[tool.setuptools.packages.find]
exclude = ["tests*", "testing*", "test_suite*"]
