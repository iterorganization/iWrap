# pytest configuration for iWrap
# This file configures pytest for the iWrap test suite including MUSCLE3 tests

[pytest]
# Test discovery patterns
python_files = test_*.py *_test.py pytests.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may require external dependencies)
    muscle3: Tests requiring MUSCLE3 library
    imas: Tests requiring IMAS library
    slow: Slow running tests
    core: Core iWrap functionality tests
    generators: Generator tests
    gui: GUI related tests

# Minimum log level
log_level = INFO

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --durations=10

# Coverage options (if pytest-cov is installed)
# Uncomment to enable coverage reporting
# addopts = 
#     --cov=iwrap
#     --cov-report=html
#     --cov-report=term-missing

# Ignore directories
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    docs
    envs

# Timeout for tests (in seconds) - requires pytest-timeout
# timeout = 300

# Filterwarnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
